name: Android debug APK

on:
  push:
    branches: [main]
    paths:
      - "game/**"
      - ".github/workflows/android-debug.yml"
  workflow_dispatch:

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "build-tools;35.0.1" "platforms;android-35"

      - name: Install Godot 4.7.2 and templates
        run: |
          wget -q "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" -O godot.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          sudo mv Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot

          wget -q "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz" -O templates.tpz
          rm -rf /tmp/night-sort-templates
          mkdir -p /tmp/night-sort-templates
          unzip -q templates.tpz -d /tmp/night-sort-templates
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          cp -R /tmp/night-sort-templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.2.stable/"

      - name: Create debug signing key
        run: |
          mkdir -p "$HOME/.local/share/godot/keystores"
          keytool -genkeypair -v             -keystore "$HOME/.local/share/godot/keystores/debug.keystore"             -storepass android             -alias androiddebugkey             -keypass android             -keyalg RSA             -keysize 2048             -validity 10000             -dname "CN=Android Debug,O=Android,C=US"

      - name: Export APK
        run: |
          mkdir -p build
          godot --headless --path game --editor --quit
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$HOME/.local/share/godot/keystores/debug.keystore"
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER="androiddebugkey"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD="android"
          godot --headless --path game --export-debug "Android" "$GITHUB_WORKSPACE/build/night-sort-debug.apk"
          test -s build/night-sort-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: night-sort-debug-apk
          path: build/night-sort-debug.apk
          if-no-files-found: error
          retention-days: 14
