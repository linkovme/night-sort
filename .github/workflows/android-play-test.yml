name: Android Play AAB test

on:
  push:
    branches: [main]
    paths:
      - "game/**"
      - ".github/workflows/android-play-test.yml"
  workflow_dispatch:

concurrency:
  group: android-play-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aab:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android 16 SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "build-tools;36.1.0" \
            "platforms;android-36" \
            "ndk;29.0.14206865" \
            "cmake;3.22.1"

      - name: Install Godot 4.7.2 and templates
        run: |
          wget -q "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" -O godot.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          sudo mv Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot

          wget -q "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz" -O templates.tpz
          rm -rf /tmp/night-sort-templates
          mkdir -p /tmp/night-sort-templates
          unzip -q templates.tpz -d /tmp/night-sort-templates
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          cp -R /tmp/night-sort-templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.2.stable/"

      - name: Create CI signing key
        run: |
          mkdir -p "$HOME/.local/share/godot/keystores"
          keytool -genkeypair -v \
            -keystore "$HOME/.local/share/godot/keystores/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Night Sort CI,O=Night Sort,C=US"

      - name: Build API 36 AAB
        run: |
          mkdir -p build
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$HOME/.local/share/godot/keystores/debug.keystore"
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER="androiddebugkey"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD="android"
          godot --headless --path game --editor --quit
          godot --headless --path game \
            --install-android-build-template \
            --export-debug "Android Play Test" \
            "$GITHUB_WORKSPACE/build/night-sort-play-test.aab"
          test -s build/night-sort-play-test.aab
          grep -q "compileSdk.*36" game/android/build/app/config.gradle
          grep -q "targetSdk.*36" game/android/build/app/config.gradle

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: night-sort-play-test-aab
          path: build/night-sort-play-test.aab
          if-no-files-found: error
          retention-days: 7
