name: Godot smoke test

on:
  push:
    branches: [main]
    paths:
      - "game/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "game/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

concurrency:
  group: godot-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot 4.7.2
        run: |
          wget -q "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" -O godot.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          sudo mv Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot

      - name: Import and parse project
        run: godot --headless --path game --editor --quit

      - name: Ad policy tests
        run: godot --headless --path game --script res://tests/ad_policy_test.gd

      - name: Launch smoke test
        run: godot --headless --path game --quit-after 10
