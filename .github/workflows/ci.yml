name: Godot smoke test

on:
  push:
    branches: [main]
    paths:
      - "game/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "game/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

concurrency:
  group: godot-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        godot: ["4.7.1", "4.7.2"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot ${{ matrix.godot }}
        run: |
          VERSION="${{ matrix.godot }}"
          wget -q "https://github.com/godotengine/godot-builds/releases/download/${VERSION}-stable/Godot_v${VERSION}-stable_linux.x86_64.zip" -O godot.zip
          unzip -q godot.zip
          chmod +x "Godot_v${VERSION}-stable_linux.x86_64"
          sudo mv "Godot_v${VERSION}-stable_linux.x86_64" /usr/local/bin/godot

      - name: Import and parse project
        run: godot --headless --path game --editor --quit

      - name: Ad policy tests
        run: godot --headless --path game --script res://tests/ad_policy_test.gd

      - name: Launch smoke test
        run: godot --headless --path game --quit-after 10
