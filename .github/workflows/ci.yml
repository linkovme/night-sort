name: Godot smoke test

on:
  push:
    branches: [main]
    paths:
      - "game/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "game/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

concurrency:
  group: godot-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        godot: ["4.7.1", "4.7.2"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot ${{ matrix.godot }}
        run: |
          VERSION="${{ matrix.godot }}"
          wget -q "https://github.com/godotengine/godot-builds/releases/download/${VERSION}-stable/Godot_v${VERSION}-stable_linux.x86_64.zip" -O godot.zip
          unzip -q godot.zip
          chmod +x "Godot_v${VERSION}-stable_linux.x86_64"
          sudo mv "Godot_v${VERSION}-stable_linux.x86_64" /usr/local/bin/godot

      - name: Import and parse project
        run: |
          set -o pipefail
          godot --headless --path game --editor --quit 2>&1 | tee /tmp/godot-import.log
          if grep -Eiq "Parser Error|Parse Error|SCRIPT ERROR|Failed to load script" /tmp/godot-import.log; then
            echo "Godot reported a script/parser error during import."
            exit 1
          fi

      - name: Ad policy tests
        run: |
          set -o pipefail
          godot --headless --path game --script res://tests/ad_policy_test.gd 2>&1 | tee /tmp/godot-tests.log
          if grep -Eiq "Parser Error|Parse Error|SCRIPT ERROR|Failed to load script|AdPolicy test failed" /tmp/godot-tests.log; then
            echo "Godot reported a script/test error."
            exit 1
          fi

      - name: Launch smoke test
        run: |
          set -o pipefail
          godot --headless --path game --quit-after 10 2>&1 | tee /tmp/godot-run.log
          if grep -Eiq "Parser Error|Parse Error|SCRIPT ERROR|Failed to load script" /tmp/godot-run.log; then
            echo "Godot reported a script/parser error during launch."
            exit 1
          fi
